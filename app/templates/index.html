<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Prediction System</title>
    <!-- We no longer use Jinja url_for. We link directly to the /static route we mounted! -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="dashboard-wrapper">
    
    <header class="overview-header">
        <h1>AI Disease Predictor</h1>
        <p>This diagnostic tool is powered by a machine learning Random Forest Classifier. Select up to 5 symptoms below, and our AI will analyze the symptom severity weights to predict the most likely disease.</p>
    </header>

    <div class="card">
        <!-- We removed the action="/predict" because Javascript handles it now -->
        <form id="prediction-form">
            
            <!-- We create an empty container for Javascript to inject the dropdowns into -->
            <div id="dropdown-container">
                <!-- Dropdowns will appear here automatically when the page loads -->
            </div>

            <button type="submit" class="btn-submit">Analyze Symptoms</button>
        </form>

        <!-- Hidden result box that Javascript will reveal when we get a prediction -->
        <div id="result-container" class="result-box" style="display: none; margin-top: 20px;">
            <h3>Predicted Diagnosis:</h3>
            <p id="prediction-text" class="diagnosis"></p>
        </div>
    </div>

</div>

<!-- ========================================== -->
<!-- 🚀 JAVASCRIPT: THE NEW "FRONTEND ENGINE" -->
<!-- ========================================== -->
<script>
    // 1. When the page loads, fetch the symptoms from our API!
    document.addEventListener("DOMContentLoaded", function() {
        fetch('/api/v1/symptoms')
            .then(response => response.json())
            .then(data => {
                const symptoms = data.symptoms;
                const container = document.getElementById("dropdown-container");
                
                // Create exactly 5 dropdowns dynamically
                for (let i = 1; i <= 5; i++) {
                    let group = document.createElement("div");
                    group.className = "form-group";
                    
                    let label = document.createElement("label");
                    label.innerText = `Symptom ${i}:`;
                    
                    let select = document.createElement("select");
                    select.id = `symptom${i}`;
                    
                    // Add default option
                    let defaultOption = document.createElement("option");
                    defaultOption.value = "";
                    defaultOption.innerText = "-- Select a Symptom --";
                    select.appendChild(defaultOption);
                    
                    // Add all symptoms from the API
                    symptoms.forEach(sym => {
                        let option = document.createElement("option");
                        option.value = sym;
                        // Format text beautifully (e.g. skin_rash -> Skin Rash)
                        option.innerText = sym.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        select.appendChild(option);
                    });
                    
                    group.appendChild(label);
                    group.appendChild(select);
                    container.appendChild(group);
                }
            })
            .catch(error => console.error("Error loading symptoms:", error));
    });

    // 2. When the user clicks the Submit button, intercept it and send JSON!
    document.getElementById("prediction-form").addEventListener("submit", function(event) {
        event.preventDefault(); // Stop the page from refreshing like old 1990s websites
        
        let selectedSymptoms = [];
        
        // Grab whatever the user selected from all 5 dropdowns
        for (let i = 1; i <= 5; i++) {
            let val = document.getElementById(`symptom${i}`).value;
            if (val !== "") {
                selectedSymptoms.push(val);
            }
        }
        
        if (selectedSymptoms.length === 0) {
            alert("Please select at least one symptom.");
            return;
        }

        // Send JSON payload to our FastAPI endpoint
        fetch('/api/v1/predict', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ "symptoms": selectedSymptoms })
        })
        .then(response => response.json())
        .then(data => {
            let resultContainer = document.getElementById("result-container");
            let predictionText = document.getElementById("prediction-text");
            
            resultContainer.style.display = "block"; // Unhide the box
            
            if (data.status === "success") {
                predictionText.innerText = data.prediction;
                predictionText.style.color = ""; // <--- Let the CSS handle the glowing green color!
            } else {
                predictionText.innerText = "Error: " + (data.detail || data.error);
                predictionText.style.color = "#ef4444"; // Red for errors
            }
        })
        .catch(error => console.error("Error making prediction:", error));
    });
</script>

</body>
</html>
